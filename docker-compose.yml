services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3005:3005"
    volumes:
      - whisper_models:/models
      - hf_cache:/root/.cache/huggingface
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_COMPUTE=int8
      - WHISPER_CPU_THREADS=1
      - WHISPER_IDLE_UNLOAD_SECONDS=600
      - OMP_NUM_THREADS=1
      # Speaker diarization (pyannote.audio). Requires a Hugging Face token
      # with access accepted on huggingface.co/pyannote/speaker-diarization-3.1
      # and .../segmentation-3.0. Left unset here, diarization is disabled.
      - HF_TOKEN=${HF_TOKEN:-}
    cpus: "1.0"
    mem_limit: "3g"
    mem_reservation: "256m"

volumes:
  whisper_models:
  hf_cache:
