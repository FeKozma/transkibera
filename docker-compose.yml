services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - whisper_models:/models
      - hf_cache:/root/.cache/huggingface
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_COMPUTE=int8
      # Match the cpus limit below. 6 of the host's 8 cores, leaving headroom
      # for the other apps on the box.
      - WHISPER_CPU_THREADS=6
      - WHISPER_IDLE_UNLOAD_SECONDS=600
      - OMP_NUM_THREADS=6
      # Speaker diarization (pyannote.audio). Requires a Hugging Face token
      # with access accepted on huggingface.co/pyannote/speaker-diarization-3.1
      # and .../segmentation-3.0. Left unset here, diarization is disabled.
      - HF_TOKEN=${HF_TOKEN:-}
      # "Skapa protokoll" meeting-protocol generation, via the Anthropic API.
      # Left unset here, the button is disabled.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    cpus: "6.0"
    # Room for large-v3-turbo plus the pyannote diarization pipeline in memory.
    mem_limit: "8g"
    mem_reservation: "256m"

volumes:
  whisper_models:
  hf_cache:
